name: deploy to hugging face

# Every push to main updates the live demo on Hugging Face Spaces.
# Needs one repository secret: HF_TOKEN (a Hugging Face token with write access).

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  HF_SPACE: sendosomething/ai-act-risk-check

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest huggingface_hub
      - name: Run tests first, never deploy a broken build
        run: pytest -q
      - name: Upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os, sys
          from huggingface_hub import HfApi

          def fail(msg):
              # ::error:: shows up as a readable annotation on the run
              print(f"::error title=Deploy failed::{msg}")
              sys.exit(1)

          token = os.environ.get("HF_TOKEN", "").strip()
          if not token:
              fail("HF_TOKEN secret is missing or empty. Add it under Settings > Secrets and variables > Actions.")

          api = HfApi(token=token)
          space = os.environ["HF_SPACE"]

          try:
              me = api.whoami()
          except Exception as e:
              fail(f"Hugging Face rejected the token ({type(e).__name__}). Check it was copied in full and is not expired.")
          role = me.get("auth", {}).get("accessToken", {}).get("role", "unknown")
          print(f"Token belongs to {me.get('name')} with role '{role}'")
          if role == "read":
              fail("HF_TOKEN is a read-only token. Create a new token with the 'Write' type.")

          try:
              api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True)
              api.upload_folder(
                  folder_path=".",
                  repo_id=space,
                  repo_type="space",
                  ignore_patterns=[".git/*", ".github/*", "tests/*", "**/__pycache__/*"],
                  commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]} from GitHub",
              )
          except Exception as e:
              fail(f"{type(e).__name__}: {str(e)[:500]}".replace("\n", " "))

          print(f"Deployed to https://huggingface.co/spaces/{space}")
          EOF
